version: "3.8"

services:
  # 1. The Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # Messaging Port
      - "15672:15672" # Web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. The API (FastAPI)
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  # 3. The Worker (CPU Mode)
  # We removed the 'deploy' section containing NVIDIA reservations.
  # The container will now default to using the standard system CPU.
  worker:
    build: .
    command: python worker.py
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MODEL_ID=Qwen/Qwen2.5-0.5B-Instruct
